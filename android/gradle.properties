org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle process: uses less memory on smaller machines.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Address of the Aura server that a fresh install connects to.
# 10.0.2.2 is the host computer as seen from the Android emulator.
# For a real phone use your computer's Wi-Fi address, e.g. http://192.168.1.20:8787,
# or your deployed server, e.g. https://aura.example.com
aura.serverUrl=http://10.0.2.2:8787
